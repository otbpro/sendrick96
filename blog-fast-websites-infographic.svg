<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Fast Ugandan websites</title>
  <desc id="description">An illustrated phone displays a quickly loading Kampala business website beside performance indicators for compressed images, caching, and mobile-first delivery.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131a37"/><stop offset="1" stop-color="#243971"/></linearGradient>
    <linearGradient id="speed"><stop stop-color="#55e3c2"/><stop offset="1" stop-color="#5aabff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#080c20" flood-opacity=".55"/></filter>
  </defs>
