<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Secure mobile money and crypto checkout</title>
  <desc id="description">A secure checkout flow offers cards, mobile money, and crypto, then passes through a shielded payment gateway to a confirmed order.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10272c"/><stop offset="1" stop-color="#164b48"/></linearGradient>
    <linearGradient id="a"><stop stop-color="#e6c46d"/><stop offset="1" stop-color="#50d2ad"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#051b1c" flood-opacity=".5"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="727" cy="62" r="175" fill="#61d6b2" opacity=".08"/>
  <text x="52" y="68" fill="#9ae2c8" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">FINTECH + PAYMENTS</text>
  <text x="52" y="111" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Checkout, made trustworthy</text>
  <text x="52" y="141" fill="#bfd8d2" font-family="Arial,sans-serif" font-size="16">More ways to pay. One secure experience.</text>
  <g filter="url(#shadow)">
    <rect x="53" y="184" width="300" height="298" rx="23" fill="#f8fbf8"/>
    <text x="80" y="220" fill="#203d39" font-family="Arial,sans-serif" font-size="15" font-weight="700">YOUR ORDER</text>
    <rect x="80" y="240" width="246" height="1" fill="#d9e6df"/>
    <rect x="80" y="258" width="52" height="55" rx="10" fill="#d9e8dc"/>
    <path d="M93 296v-20l13-10 13 10v20h-26Zm9 0v-12h9v12" fill="#688d70"/>
    <text x="146" y="275" fill="#354f49" font-family="Arial,sans-serif" font-size="12" font-weight="700">Crafted basket</text>
    <text x="146" y="294" fill="#778b84" font-family="Arial,sans-serif" font-size="11">Qty 1 · Kampala delivery</text>
    <text x="311" y="277" text-anchor="end" fill="#354f49" font-family="Arial,sans-serif" font-size="12" font-weight="700">UGX 85,000</text>
    <rect x="80" y="328" width="246" height="1" fill="#d9e6df"/>
    <text x="80" y="356" fill="#203d39" font-family="Arial,sans-serif" font-size="13" font-weight="700">Choose a payment method</text>
    <rect x="80" y="372" width="246" height="29" rx="8" fill="#eaf4ef" stroke="#55a984"/>
    <rect x="91" y="380" width="25" height="14" rx="3" fill="#547d9b"/><path d="M92 385h23" stroke="#e8f3fa" stroke-width="2"/>
    <text x="128" y="391" fill="#38574e" font-family="Arial,sans-serif" font-size="11" font-weight="700">Card</text>
    <circle cx="309" cy="386" r="6" fill="#43a985"/>
    <rect x="80" y="409" width="246" height="29" rx="8" fill="#fff" stroke="#dce8e1"/>
    <rect x="91" y="416" width="19" height="15" rx="4" fill="#e97463"/><path d="M96 424h9m-4-4v8" stroke="#fff" stroke-width="1.5"/>
    <text x="128" y="428" fill="#38574e" font-family="Arial,sans-serif" font-size="11" font-weight="700">Mobile money</text>
    <rect x="80" y="446" width="246" height="24" rx="8" fill="#fff" stroke="#dce8e1"/>
    <circle cx="101" cy="458" r="8" fill="#e2a741"/><text x="101" y="462" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="10" font-weight="700">₿</text>
    <text x="128" y="462" fill="#38574e" font-family="Arial,sans-serif" font-size="11" font-weight="700">Crypto via trusted provider</text>
  </g>
  <path d="M354 330h58m-15-10 15 10-15 10" fill="none" stroke="#78e0bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <path d="M510 202 616 239v83c0 70-41 114-106 145-65-31-106-75-106-145v-83Z" fill="#f4fbf7" stroke="#9be1bd" stroke-width="4"/>
    <path d="m451 318 39 38 78-83" fill="none" stroke="#39a883" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="414" text-anchor="middle" fill="#31544a" font-family="Arial,sans-serif" font-size="13" font-weight="700">LICENSED GATEWAY</text>
  </g>
  <path d="M620 330h57m-15-10 15 10-15 10" fill="none" stroke="#78e0bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="685" y="261" width="83" height="134" rx="16" fill="#e4f2e8"/>
    <circle cx="726" cy="303" r="20" fill="#3ba780"/><path d="m716 303 7 7 14-16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="726" y="344" text-anchor="middle" fill="#31544a" font-family="Arial,sans-serif" font-size="10" font-weight="700">ORDER</text>
    <text x="726" y="359" text-anchor="middle" fill="#31544a" font-family="Arial,sans-serif" font-size="10" font-weight="700">CONFIRMED</text>
  </g>
  <rect x="52" y="530" width="693" height="1" fill="#c4e6d7" opacity=".35"/>
  <text x="52" y="559" fill="#e1f1e9" font-family="Arial,sans-serif" font-size="14">Keep sensitive payment data with trusted providers.</text>
  <text x="744" y="559" fill="#9ae2c8" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700">04 / 06</text>
