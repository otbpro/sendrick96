  <rect x="52" y="530" width="693" height="1" fill="#f2d5ce" opacity=".35"/>
  <text x="52" y="559" fill="#f7e5df" font-family="Arial,sans-serif" font-size="14">Make every campaign measurable. Improve what works.</text>
  <text x="744" y="559" fill="#ffc18a" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700">03 / 06</text>
</svg>
